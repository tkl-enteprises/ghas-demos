# ---------------------------------------------------------------------------
# Dependabot configuration
#
# Powers lesson 06. Dependabot will open security update PRs against the
# intentionally-vulnerable requirements.txt under lesson 06.
# ---------------------------------------------------------------------------

version: 2
updates:
  # Lesson 06: intentionally-vulnerable Python deps used to demo
  # supply-chain alerts and grouped security update PRs. The schedule controls
  # version-update checks; security updates are created in response to alerts.
  - package-ecosystem: "pip"
    directory: "/lessons/06-dependabot-supply-chain"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      lesson-six-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "lesson-06"

  # Keep our GitHub Actions pinned and patched.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"

  # Lesson 07: Python deps for the Bandit/SARIF demo.
  - package-ecosystem: "pip"
    directory: "/lessons/07-sarif-integration"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "lesson-07"
