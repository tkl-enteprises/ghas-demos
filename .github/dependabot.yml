# ---------------------------------------------------------------------------
# Dependabot configuration
#
# Powers lesson 10. Dependabot will open security update PRs against the
# intentionally-vulnerable requirements.txt under lesson 10.
# ---------------------------------------------------------------------------

version: 2
updates:
  # Lesson 10: intentionally-vulnerable Python deps used to demo
  # supply-chain alerts and grouped security update PRs. The schedule controls
  # version-update checks; security updates are created in response to alerts.
  - package-ecosystem: "pip"
    directory: "/lessons/10-supply-chain-dependabot"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      lesson-ten-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "lesson-10"

  # Keep our GitHub Actions pinned and patched.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"

  # Lesson 04: Python deps for the Bandit/SARIF demo.
  - package-ecosystem: "pip"
    directory: "/lessons/04-code-security-sarif-integration"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "lesson-04"
