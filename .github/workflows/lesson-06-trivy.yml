# ---------------------------------------------------------------------------
# Trivy configuration scan -> SARIF -> Code Scanning
#
# Gives lesson 06 deterministic findings in this repository. The separate
# AI-powered detections exercise remains PR-only and requires default setup.
# ---------------------------------------------------------------------------

name: "Lesson 06 Trivy SARIF"

on:
  push:
    branches: [main]
    paths:
      - "lessons/06-code-security-ai-detections/**"
      - ".github/workflows/lesson-06-trivy.yml"
  pull_request:
    branches: [main]
    paths:
      - "lessons/06-code-security-ai-detections/**"
      - ".github/workflows/lesson-06-trivy.yml"
  schedule:
    # Every Monday at 06:45 UTC
    - cron: "45 6 * * 1"
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  scan:
    name: Trivy misconfiguration scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Scan lesson 06 configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: lessons/06-code-security-ai-detections
          scanners: misconfig
          severity: LOW,MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: 0

      - name: Normalize SARIF paths to the repository root
        run: |
          jq --arg prefix "lessons/06-code-security-ai-detections/" '
            (.runs[].results[]?.locations[]?.physicalLocation.artifactLocation.uri) |=
              if startswith($prefix) then . else $prefix + . end
          ' trivy-results.sarif > trivy-results.normalized.sarif
          mv trivy-results.normalized.sarif trivy-results.sarif

      - name: Upload Trivy results to Code Scanning
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: trivy-results.sarif
          category: lesson-06-trivy
