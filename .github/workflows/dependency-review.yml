# ---------------------------------------------------------------------------
# Dependency Review
#
# Powers lesson 06. Blocks PRs that introduce known-vulnerable deps.
# ---------------------------------------------------------------------------

name: "Dependency Review"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@v5 # v4.5.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
