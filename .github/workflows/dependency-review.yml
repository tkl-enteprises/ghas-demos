# ---------------------------------------------------------------------------
# Dependency Review
#
# Powers lesson 09. Blocks PRs that introduce known-vulnerable deps.
# ---------------------------------------------------------------------------

name: "Dependency Review"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@v4 # v4.5.0
        with:
          fail-on-severity: moderate
          # Lesson 09 intentionally pins these advisories for the Dependabot demo.
          allow-ghsas: >-
            GHSA-gq9m-qvpx-68hc, GHSA-j544-7q9p-6xp8,
            GHSA-xg9f-g7g7-2323, GHSA-2g68-c3qc-8985,
            GHSA-f9vj-2wh5-fj8j, GHSA-hgf8-39gv-g3f2,
            GHSA-87hc-h4r5-73f7, GHSA-29vq-49wr-vm6x,
            GHSA-hggm-jpg3-v476, GHSA-x4qr-2fvf-3mr5,
            GHSA-3ww4-gg4f-jr7f, GHSA-r6ph-v2qm-q3c2,
            GHSA-537c-gmf6-5ccf, GHSA-w7pp-m8wf-vj6r,
            GHSA-9v9h-cgj8-h64p
          comment-summary-in-pr: on-failure
