# ---------------------------------------------------------------------------
# Dependency Review
#
# Powers lesson 10. Blocks PRs that introduce known-vulnerable deps.
# ---------------------------------------------------------------------------

name: "Dependency Review"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@v4 # v4.5.0
        with:
          fail-on-severity: moderate
          # Lesson 10 intentionally pins these advisories for the Dependabot demo.
          allow-ghsas: >-
            GHSA-29vq-49wr-vm6x, GHSA-2g68-c3qc-8985,
            GHSA-2xpw-w6gg-jr37, GHSA-34jh-p97f-mpxf,
            GHSA-38jv-5279-wg99, GHSA-3pqx-4fqf-j49f,
            GHSA-3ww4-gg4f-jr7f, GHSA-462w-v97r-4m45,
            GHSA-537c-gmf6-5ccf, GHSA-562c-5r94-xh97,
            GHSA-5wv5-4vpf-pj6m, GHSA-6757-jp84-gxfx,
            GHSA-87hc-h4r5-73f7, GHSA-8q59-q68h-6hv4,
            GHSA-9hjg-9r4m-mvj7, GHSA-9v9h-cgj8-h64p,
            GHSA-9wx4-h78v-vm56, GHSA-cpwx-vrp4-4pq7,
            GHSA-f9vj-2wh5-fj8j, GHSA-g3rq-g295-4j3m,
            GHSA-g4mx-q9vg-27p4, GHSA-gc5v-m9x4-r6x2,
            GHSA-gm62-xv2j-4w53, GHSA-gq9m-qvpx-68hc,
            GHSA-gwvm-45gx-3cf8, GHSA-h5c8-rqwp-cp95,
            GHSA-h75v-3vvj-5mfj, GHSA-hgf8-39gv-g3f2,
