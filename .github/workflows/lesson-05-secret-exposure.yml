# Intentionally vulnerable training example. The job-level false condition is a
# safety boundary: CodeQL analyzes this workflow, but GitHub Actions never runs it.
name: "Lesson 05 - secret exposure (disabled)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-exposure-demo:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Print repository password
        env:
          REPOSITORY_PASSWORD: ${{ fromJSON(secrets.LESSON_05_CREDENTIALS).password }}
        run: python lessons/05-code-security-actions/print_repository_secret.py
