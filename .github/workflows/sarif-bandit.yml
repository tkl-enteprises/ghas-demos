# ---------------------------------------------------------------------------
# Bandit -> SARIF -> Code Scanning
#
# Powers lesson 04. Demonstrates ingesting 3rd-party SAST output (Bandit)
# into Code Scanning via SARIF.
# ---------------------------------------------------------------------------

name: "Bandit SARIF"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 06:30 UTC
    - cron: "30 6 * * 1"

permissions:
  security-events: write
  contents: read

jobs:
  bandit:
    name: Bandit scan + SARIF upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install -r lessons/04-code-security-sarif-integration/requirements.txt

      - name: Run Bandit (SARIF output)
        run: bandit -r lessons/04-code-security-sarif-integration -f sarif -o bandit.sarif --exit-zero

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: bandit.sarif
          category: bandit
