# ---------------------------------------------------------------------------
# CodeQL static analysis
#
# This workflow runs CodeQL static analysis. Powers lessons 01, 04, 05.
# Custom queries in .github/codeql/custom-queries/ are loaded via
# codeql-config.yml.
# ---------------------------------------------------------------------------

name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            # `none` skips the legacy autobuild step. Python is interpreted
            # so CodeQL doesn't need to compile/install — and trying to
            # `pip install -r requirements.txt` on intentionally-vulnerable
            # pinned deps (Flask 0.12, urllib3 1.24.1, ...) breaks on modern
            # Python versions, which is exactly what this repo plants.
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4 # v3.27.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4 # v3.27.5
        with:
          category: "/language:${{ matrix.language }}"
