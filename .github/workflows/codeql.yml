# ---------------------------------------------------------------------------
# CodeQL static analysis
#
# This workflow runs CodeQL static analysis. Powers lessons 01, 04, 05.
# Custom queries in .github/codeql/custom-queries/ are loaded via
# codeql-config.yml.
# ---------------------------------------------------------------------------

name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3 # v3.27.5
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3 # v3.27.5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3 # v3.27.5
        with:
          category: "/language:${{ matrix.language }}"
