# ---------------------------------------------------------------------------
# Workshop-infrastructure tests
#
# Runs the pytest suite under tests/ on every push/PR to main. These tests
# validate static repo invariants (lesson layout, link integrity, workflow
# paths, action pinning, script smoke, manifest shape). They never assert that
# the demo code is secure — the fixture guards assert the opposite: that the
# planted vulnerabilities survive, so an Autofix/Copilot fix PR fails here.
#
# This workflow is intentionally NOT part of the required-status-checks
# ruleset on main. It's an early-warning canary for facilitator-ergonomics
# regressions; the security workflows (CodeQL, Bandit SARIF, Dependency
# Review) remain the gating signal.
# ---------------------------------------------------------------------------

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short
