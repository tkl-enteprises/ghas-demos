# ---------------------------------------------------------------------------
# Custom secret scanning patterns
#
# Powers lesson 06. These custom regex patterns are detected by GHAS Secret
# Scanning. The demo Python file in lesson 06 contains FAKE matching strings.
# ---------------------------------------------------------------------------

patterns:
  - name: TKL Internal Token
    regex_pattern: 'TKL-INTERNAL-[A-Z0-9]{12,16}'
    test_string: 'TKL-INTERNAL-ABC123XYZ7890'

  - name: TKL Workshop Demo Key
    regex_pattern: 'tkl_demo_[a-z0-9]{32}'
    test_string: 'tkl_demo_abcdef0123456789abcdef0123456789'
