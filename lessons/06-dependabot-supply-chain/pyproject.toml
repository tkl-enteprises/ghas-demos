# ⚠️ INTENTIONALLY VULNERABLE — pinned to known-vulnerable versions for demo.
# Mirrors requirements.txt so PEP 621 / Poetry users see the same dep graph.

[project]
name = "ghas-demo-dependabot"
version = "0.0.1"
description = "Intentionally vulnerable Flask app for the GHAS Dependabot / supply chain workshop."
requires-python = ">=3.8"
dependencies = [
    "Flask==0.12.0",
    "Jinja2==2.10",
    "Werkzeug==3.1.6",
    "urllib3==1.24.1",
    "requests==2.19.1",
    "PyYAML==6.0.3",
    "cryptography==46.0.7",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
